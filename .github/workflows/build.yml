name: Compilar APK Flet

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Instalar dependencias y Flet CLI
        run: |
          python -m pip install --upgrade pip
          pip install flet

      - name: Construir APK de Flet
        run: |
          flet build apk --project-name "Agenda Citas Pro"

      - name: Guardar APK generado
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: build/s/outputs/apk/release/app-release.apk
